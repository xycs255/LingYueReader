name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # 默认还会装已下架的 'tools' 包，导致 sdkmanager 失败。
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # 仓库设置了签名密钥（Settings → Secrets and variables → Actions）时用正式签名，
      # 没设置（或来自 fork 的 PR 拿不到 secrets）时 Gradle 退回调试签名。
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LINGYUE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LINGYUE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LINGYUE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LINGYUE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] || [ -n "$KEYSTORE_PASSWORD" ] || [ -n "$KEY_ALIAS" ] || [ -n "$KEY_PASSWORD" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Release signing is only partially configured." >&2
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lingyue-release.p12"
            echo "LINGYUE_KEYSTORE_FILE=$RUNNER_TEMP/lingyue-release.p12" >> "$GITHUB_ENV"
            echo "LINGYUE_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "No release key configured; using the debug key."
          fi
      - name: Unit tests, lint and APKs
        env:
          LINGYUE_KEYSTORE_PASSWORD: ${{ secrets.LINGYUE_KEYSTORE_PASSWORD }}
          LINGYUE_KEY_ALIAS: ${{ secrets.LINGYUE_KEY_ALIAS }}
          LINGYUE_KEY_PASSWORD: ${{ secrets.LINGYUE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lint :app:assembleRelease
      - name: Verify release APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" verify "$apk"
          if [ "${LINGYUE_RELEASE_SIGNING:-0}" = 1 ] && "$signer" verify --print-certs "$apk" | grep -Fq 'CN=Android Debug'; then
            echo "Release signing was configured, but the APK uses the debug certificate." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LingYueReader-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Verify night UI screenshots
        run: test -s app/build/outputs/ui-check/night-catalog.png && test -s app/build/outputs/ui-check/night-typography.png
      - uses: actions/upload-artifact@v4
        with:
          name: LingYueReader-night-ui
          path: |
            app/build/outputs/ui-check/night-catalog.png
            app/build/outputs/ui-check/night-typography.png
          if-no-files-found: error
      - name: Verify paper UI screenshots
        run: |
          for screen in shelf writing work editor vocabulary stats me theme reader; do
            test -s "app/build/outputs/ui-check/paper-$screen.png"
          done
          for screen in theme me writing; do
            test -s "app/build/outputs/ui-check/ink-$screen.png"
          done
          test -s app/build/outputs/ui-check/stats-expanded.png
          test -s app/build/outputs/ui-check/selection-compact.png
      - uses: actions/upload-artifact@v4
        with:
          name: LingYueReader-ui-samples
          path: |
            app/build/outputs/ui-check/paper-*.png
            app/build/outputs/ui-check/ink-*.png
            app/build/outputs/ui-check/stats-expanded.png
            app/build/outputs/ui-check/selection-compact.png
          if-no-files-found: error
      - name: Verify motion UI previews
        run: |
          test -s app/build/outputs/ui-check/import-modes.png
          test -s app/build/outputs/ui-check/page-mode-preview.png
          test -s app/build/outputs/ui-check/page-cover-mid.png
          test -s app/build/outputs/ui-check/page-curl-middle.png
          test -s app/build/outputs/ui-check/page-curl-portrait-mid.png
          test -s app/build/outputs/ui-check/page-slide-landscape-mid.png
          test -s app/build/outputs/ui-check/page-cover-landscape-mid.png
          test -s app/build/outputs/ui-check/page-curl-landscape-mid.png
          test -s app/build/outputs/ui-check/page-curl-landscape-back-mid.png
          test -s app/build/outputs/ui-check/page-curl-landscape-back-twice-mid.png
      - uses: actions/upload-artifact@v4
        with:
          name: LingYueReader-motion-ui
          path: |
            app/build/outputs/ui-check/import-modes.png
            app/build/outputs/ui-check/page-mode-preview.png
            app/build/outputs/ui-check/page-cover-mid.png
            app/build/outputs/ui-check/page-curl-middle.png
            app/build/outputs/ui-check/page-curl-portrait-mid.png
            app/build/outputs/ui-check/page-slide-landscape-mid.png
            app/build/outputs/ui-check/page-cover-landscape-mid.png
            app/build/outputs/ui-check/page-curl-landscape-mid.png
            app/build/outputs/ui-check/page-curl-landscape-back-mid.png
            app/build/outputs/ui-check/page-curl-landscape-back-twice-mid.png
          if-no-files-found: error
